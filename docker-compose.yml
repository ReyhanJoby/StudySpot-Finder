version: "3.8"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5000

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MICROSERVICE_URL=http://microservice:5001
    depends_on:
      - microservice

  microservice:
    build: ./microservice
    ports:
      - "5001:5001"
    env_file:
      - ./microservice/.env